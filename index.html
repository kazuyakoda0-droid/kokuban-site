<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>各種表示</title>
<style>
:root { color-scheme: light dark; --fg:#1a1a1a; --bg:#fff; --muted:#666;
        --line:#ddd; --quote:#f6f6f6; --todo:#ffdede; --todofg:#a00; }
@media (prefers-color-scheme: dark) {
  :root { --fg:#e8e8e8; --bg:#171717; --muted:#a0a0a0;
          --line:#3a3a3a; --quote:#222; --todo:#5a1f1f; --todofg:#ffb4b4; }
}
* { box-sizing: border-box; }
body { margin:0; padding:2rem 1.25rem 5rem; color:var(--fg); background:var(--bg);
       font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
       line-height:1.9; font-size:16px; }
main { max-width: 44rem; margin: 0 auto; }
h1 { font-size:1.6rem; line-height:1.5; border-bottom:2px solid var(--line);
     padding-bottom:.6rem; margin-top:0; }
h2 { font-size:1.2rem; margin-top:2.4rem; border-bottom:1px solid var(--line);
     padding-bottom:.3rem; }
h3 { font-size:1.05rem; margin-top:1.8rem; }
p, li { overflow-wrap: anywhere; }
code { background:var(--quote); padding:.1em .35em; border-radius:3px;
       font-size:.9em; }
blockquote { margin:1.2rem 0; padding:.8rem 1rem; background:var(--quote);
             border-left:3px solid var(--line); color:var(--muted); }
hr { border:0; border-top:1px solid var(--line); margin:2.4rem 0; }
/* 表は幅の狭い端末でも壊れないよう、自分の中で横に送る */
.tablewrap { overflow-x:auto; margin:1.2rem 0; }
table { border-collapse:collapse; width:100%; font-size:.95rem; }
th, td { border:1px solid var(--line); padding:.5rem .7rem; text-align:left;
         vertical-align:top; }
th { background:var(--quote); }
a { color:inherit; }
.todo { background:var(--todo); color:var(--todofg); font-weight:bold;
        padding:.05em .3em; border-radius:3px; }
.banner { background:var(--todo); color:var(--todofg); border-radius:6px;
          padding:1rem 1.2rem; margin-bottom:2rem; font-weight:bold; }
footer { margin-top:4rem; padding-top:1.2rem; border-top:1px solid var(--line);
         color:var(--muted); font-size:.9rem; }
</style>
</head>
<body><main><h1>各種表示</h1><ul><li><a href="privacy.html">プライバシーポリシー</a></li>
<li><a href="tokushoho.html">特定商取引法に基づく表示</a></li></ul></main></body>
</html>
